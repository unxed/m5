[workspace]
members = [
    "crates/m5-term",
    "crates/m5-ui",
    "crates/m5-config",
    "crates/m5-fs",
    "crates/m5-ops",
    "crates/m5",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "BSD-3-Clause"
repository = "https://github.com/unxed/m5"
authors = ["unxed contributors"]

[workspace.dependencies]
crossterm = "0.28"
unicode-width = "0.1"
unicode-segmentation = "1.11"
base64 = "0.22"
thiserror = "1.0"
anyhow = "1.0"
libc = "0.2"
signal-hook = "0.3"
tempfile = "3.10"
filetime = "0.2"
