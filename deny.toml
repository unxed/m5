# Cargo deny configuration for license checking
# Ensures all dependencies use BSD-3 compatible licenses

[advisories]
# Deny all security vulnerabilities
vulnerability = "deny"
# Deny all unmaintained crates
unmaintained = "deny"
# Warn on crates that are no longer actively maintained
notice = "warn"

[licenses]
# Require all crates to have a recognized license
unlicensed = "deny"
# Deny GPL, LGPL, MPL and similar copyleft licenses
copyleft = "deny"
# List of allowed license identifiers
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 OR MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "Unicode-DFS-2016",
    "ISC",
]
# Skip copyleft check for crates where it's acceptable
copyleft-exceptions = [
]

[bans]
# Deny duplicate versions of crates
multiple-versions = "deny"
# Allow only a few common wildcard dependencies
allow-wildcard-dependencies = false
