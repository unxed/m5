# cargo-deny configuration (format of cargo-deny >= 0.16).
# CI runs only `cargo deny check licenses`; advisories/bans are not checked in CI.

[licenses]
# Licenses are denied unless listed here (cargo-deny >= 0.16 semantics).
# Each entry must be a single SPDX identifier (no OR/AND expressions).
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
