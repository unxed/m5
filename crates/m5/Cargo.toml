[package]
name = "m5"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "m5: Midnight Commander-like file manager on Rust"

[[bin]]
name = "m5"
path = "src/main.rs"

[dependencies]
m5-term = { path = "../m5-term" }
